<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./src/output.css" rel="stylesheet">
    <link href="./src/input.css" rel="stylesheet">
</head>

<body id="vanta-bg">
    <div class="Landing-page">
        <div class="flex flex-col justify-center items-center h-screen">
            <h1 class="text-4xl font-bold mb-4 text-white">Welcome to the Piano App</h1>
            <p class="text-lg mb-8 text-gray-100">Click the button below to start playing!</p>
         <button class="relative px-6 py-3 rounded text-white overflow-hidden cursor-pointer" onclick="window.location.href='piano.html'">
  <span class="absolute inset-0 bg-orange-900 opacity-40 rounded transition-opacity duration-100 hover:opacity-60"></span>
  <span class="relative">Start Playing</span>
</button>

        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.trunk.min.js"></script>
    <script>
        VANTA.TRUNK({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200,
            minWidth: 200,
            scale: 1.0,
            scaleMobile: 1.0
        });
    </script>


    <script src="script.js"></script>
</body>

</html>
